name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          host="$(printf '%s' "$DEPLOY_SSH_HOST" | tr -d '[:space:]')"
          user="$(printf '%s' "$DEPLOY_SSH_USER" | tr -d '[:space:]')"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$user@$host" \
            'set -e; cd /var/www/osteps/Osteps; git pull origin main; npm install --no-audit --no-fund; NODE_OPTIONS=--max-old-space-size=5120 npm run build; pm2 restart osteps'

      - name: Production health check
        run: |
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' https://osteps.com/ || true)"
            if [ "$status" = "200" ]; then
              echo "Production health check passed."
              exit 0
            fi
            echo "Health check attempt ${attempt}/12 returned HTTP ${status}; retrying in 5 seconds."
            sleep 5
          done
          echo "Production health check failed after 60 seconds."
          exit 1

      # Replace this placeholder with Slack/email notification integration.
      - name: Notification placeholder
        if: ${{ failure() }}
        run: echo "Deployment failure notification integration is not configured."
