name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/osteps/Osteps
            git pull origin main
            npm install --no-audit --no-fund
            NODE_OPTIONS=--max-old-space-size=5120 npm run build
            pm2 restart osteps

      - name: Production health check
        run: |
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' https://osteps.com/ || true)"
            if [ "$status" = "200" ]; then
              echo "Production health check passed."
              exit 0
            fi
            echo "Health check attempt ${attempt}/12 returned HTTP ${status}; retrying in 5 seconds."
            sleep 5
          done
          echo "Production health check failed after 60 seconds."
          exit 1

      # Replace this placeholder with Slack/email notification integration.
      - name: Notification placeholder
        if: ${{ failure() }}
        run: echo "Deployment failure notification integration is not configured."
